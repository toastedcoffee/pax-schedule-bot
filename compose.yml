services:
  paxbot:
    build: .
    image: paxbot:latest
    # TrueNAS SCALE's `apps` user by default. Set PAXBOT_UID / PAXBOT_GID in
    # .env to run as a different host user instead.
    user: "${PAXBOT_UID:-568}:${PAXBOT_GID:-568}"
    command: ["bot"]
    restart: unless-stopped
    # The LEAP fetch has a 30s read timeout. Docker's default grace period is
    # 10s, so a `docker stop` landing mid-sync would be SIGKILLed - WAL keeps
    # the database intact, but that sync's update would be lost.
    stop_grace_period: 30s
    env_file: .env
    environment:
      PAXBOT_DB: /data/paxbot.db
      PAXBOT_CONFIG: /app/shows.toml
    volumes:
      # On TrueNAS point this at a dataset, e.g. /mnt/tank/apps/paxbot/data,
      # and give it the "Apps" permission preset. Elsewhere it must be
      # writable by the container's uid:
      #   mkdir -p ./data && sudo chown 568:568 ./data
      - ./data:/data
      # Mounted so a new PAX convention needs no image rebuild.
      - ./shows.toml:/app/shows.toml:ro
